services:
  redis:
    image: redis:7-alpine
    container_name: nepal-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      target: dev
    container_name: nepal-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173
      NODE_ENV: development
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      target: dev
    container_name: nepal-client
    restart: unless-stopped
    environment:
      VITE_DOCKER_PROXY_TARGET: http://server:5000
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  redis_data: